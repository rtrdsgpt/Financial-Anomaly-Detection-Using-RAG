[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-anomaly-detection-rag"
version = "0.1.0"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Conservative defaults (pyflakes + basic pycodestyle) -- catches real
# issues (undefined names, unused imports, syntax problems), not the full
# opinionated rule catalog. The Strategy/Factory classes deliberately use
# broad `except Exception` blocks to convert third-party API failures into
# this project's own exception types (see core/exceptions.py); the
# extended bugbear rules would flag that pattern everywhere it's used on
# purpose.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Package __init__.py files deliberately re-export their submodule's
# public names via `import *` (a pattern predating this fork) -- ruff
# can't verify there's no name collision across a wildcard import, but
# there isn't one here; not worth rewriting every module's public API
# into explicit __all__ lists for this project's size.
"__init__.py" = ["F403"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: real network/model calls -- excluded from the default run",
]
